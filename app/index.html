<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Trends</title>
<meta name="theme-color" content="#0A1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green Trends">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon-96.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: deep navy shell with a glowing branded header; white sheets below; reports keep each branch's Excel colours */
:root{
  --navy:#0A1A2B;--navy2:#132B44;--navy3:#1C3A58;--ground:#EEF1F6;--card:#FFFFFF;--ink:#0A1A2B;--muted:#5A6779;--line:#E2E7EF;--soft:#F6F8FB;
  --gt:#1E9E63;--gth:#7EE0AE;--gts:#E2F5EC;--pink:#E0217A;--pinks:#FCE4EF;
  --ok:#14804A;--oks:#DFF3E8;--warn:#9A6200;--warns:#FDF0D5;--bad:#B4362B;--bads:#FBE6E3;--info:#2D4E9E;--infos:#E6EDFB;
  --fd:'Outfit',ui-sans-serif,system-ui,sans-serif;--fb:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--gt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}


/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(900px 500px at 85% -10%,#1B4A3E 0%,transparent 60%),radial-gradient(700px 500px at -10% 110%,#3B1440 0%,transparent 55%),var(--navy)}
.lcard{width:100%;max-width:400px;color:#fff}
.lmark{width:60px;height:60px;border-radius:20px;background:linear-gradient(140deg,var(--gt),#0F7A4B);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:22px;margin-bottom:24px;box-shadow:0 12px 30px rgba(30,158,99,.35)}
.lcard h1{font-family:var(--fd);font-weight:700;font-size:34px;margin:0 0 6px;letter-spacing:-.01em}
.lcard h1 em{font-style:normal;color:var(--pink)}
.lcard p{color:#9FB0C2;margin:0 0 26px}
.lf{display:grid;gap:12px}
.lf input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:15px 16px;color:#fff;font-size:16px}
.lf input::placeholder{color:#8396AB}
.lbtn{background:var(--gt);color:#fff;border-radius:16px;padding:15px;font-weight:800;font-size:15px;width:100%}
.ldemo{margin-top:26px;display:grid;gap:10px}
.ldemo button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#E3EBF3;border-radius:16px;padding:13px 14px;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center}
.lerr{color:#FFB4A8;font-size:13px;min-height:18px}

/* shell */
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:104px}
.hd{color:#fff;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden;
  background:radial-gradient(600px 300px at 100% 0%,rgba(30,158,99,.38),transparent 65%),radial-gradient(500px 280px at 0% 120%,rgba(224,33,122,.22),transparent 60%),var(--navy)}
.hd::before,.hd::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.hd::before{width:420px;height:420px;right:-140px;top:-220px}
.hd::after{width:260px;height:260px;right:-60px;top:-140px;border-color:rgba(126,224,174,.18)}
.hdin{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gth)}
.hd .br{font-family:var(--fd);font-size:28px;font-weight:700;line-height:1.1;margin-top:4px;letter-spacing:-.01em}
.hd .dt{color:#A9B9CA;font-size:13px;margin-top:4px;font-weight:600}
.hd .rt{display:flex;gap:8px;align-items:center}
.av{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.14)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid;gap:16px;margin-top:-44px;position:relative;z-index:2}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
.navin{max-width:540px;margin:0 auto;background:rgba(10,26,43,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 14px 34px rgba(10,26,43,.35);pointer-events:auto}
.navin button{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:700;color:#8EA0B4;padding:7px 4px;border-radius:16px;min-width:50px;flex:1;position:relative}
.navin button.on{color:#fff;background:rgba(255,255,255,.1)}
.navin button.on svg{color:var(--gth)}
.navin svg,.side svg{width:21px;height:21px}
.navin .bd{position:absolute;top:3px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
@media (min-width:980px){
  .side{display:flex;flex-direction:column;width:244px;flex:none;background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;gap:4px;border-right:1px solid rgba(255,255,255,.06)}
  .side .lg{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;font-family:var(--fd);font-weight:700;font-size:18px}
  .side .lg span{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--gt),#0F7A4B);display:grid;place-items:center;font-size:14px}
  .side .lg small{display:block;font-family:var(--fb);font-size:11px;color:#8EA0B4;font-weight:600}
  .side button.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:#A9B8C8;font-weight:700;text-align:left}
  .side button.it:hover{background:rgba(255,255,255,.05)}
  .side button.it.on{background:rgba(255,255,255,.09);color:#fff}
  .side button.it.on svg{color:var(--gth)}
  .side .who{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12px;color:#A9B8C8}
  .side .who b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
  .nav{display:none}
  .main{padding-bottom:48px}
  .hd{padding-block:28px 72px}
  .hd .br{font-size:32px}
}

/* header hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-family:var(--fd);font-size:24px;font-weight:700;line-height:1}
.ring .rv small{font-size:10.5px;color:#A9B9CA;font-weight:700;margin-top:3px}
.glass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;min-width:0}
.gl small{display:block;font-size:11px;color:#A9B9CA;font-weight:700}
.gl b{display:block;font-family:var(--fd);font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
@media (max-width:420px){.hero{grid-template-columns:1fr}.ring{display:none}.gl b{font-size:17px}}

/* cards */
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0;box-shadow:0 1px 0 rgba(10,26,43,.04),0 8px 24px rgba(10,26,43,.05)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ct{font-family:var(--fd);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib.g{background:var(--gts);color:var(--gt)}.ib.p{background:var(--pinks);color:var(--pink)}.ib.b{background:var(--infos);color:var(--info)}.ib.y{background:var(--warns);color:var(--warn)}.ib.n{background:#E6EAF0;color:var(--navy)}
.cs{color:var(--muted);font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--oks);color:var(--ok)}.p-warn{background:var(--warns);color:var(--warn)}.p-bad{background:var(--bads);color:var(--bad)}.p-info{background:var(--infos);color:var(--info)}.p-gt{background:var(--gts);color:var(--gt)}.p-mu{background:var(--soft);color:var(--muted)}
.hd .pill.p-mu{background:rgba(255,255,255,.08);color:#C9D5E1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;background:var(--gt);color:#fff;white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.dk{background:var(--navy)}
.btn.pk{background:var(--pink)}
.btn.gh{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%;padding:16px;font-size:15px;border-radius:18px}
.btn svg{width:17px;height:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l small{color:var(--muted);font-size:12px;font-weight:600}
.tap{width:100%;text-align:left;border-radius:12px}
.tap:hover{background:var(--soft)}
.g2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){.g2{grid-template-columns:1.3fr 1fr}.g2e{grid-template-columns:1fr 1fr}}
.empty{color:var(--muted);font-size:13px;padding:6px 0;font-weight:600}
.note{border-radius:16px;padding:13px 15px;font-size:13px;font-weight:600}
.n-warn{background:var(--warns);color:#6B4500}.n-bad{background:var(--bads);color:#8C2219}.n-ok{background:var(--oks);color:#0F5C37}.n-info{background:var(--infos);color:#1F3A7A}

/* next-up */
.next{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--gt),#11784A);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 12px 28px rgba(30,158,99,.28)}
.next .tx{flex:1;min-width:0}
.next small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#C9F3DD}
.next b{display:block;font-family:var(--fd);font-size:20px;font-weight:700;margin-top:2px}
.next .btn{background:#fff;color:var(--gt)}
.next.done{background:linear-gradient(120deg,var(--navy2),var(--navy))}
.next.done small{color:var(--gth)}.next.done .btn{color:var(--navy)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tli{border-radius:16px;padding:11px 8px;text-align:center;background:var(--soft);min-width:0;position:relative}
.tli b{display:block;font-family:var(--fd);font-size:15px;font-weight:700}
.tli small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli.sent{background:var(--gts)}.tli.sent small{color:var(--gt)}
.tli.due{background:var(--navy);color:#fff}.tli.due small{color:var(--gth)}
button.tli{width:100%}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border-radius:18px;padding:14px;background:var(--soft);text-align:left;display:grid;gap:8px;min-width:0}
.tile:hover{background:#EEF2F7}
.tile b{font-weight:800;font-size:13.5px}
.tile .v{font-family:var(--fd);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile small{font-size:11.5px;color:var(--muted);font-weight:700}
.tile.miss small{color:var(--bad)}

/* attendance */
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ar:first-of-type{border-top:0}
.gh4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.nm{display:flex;align-items:center;gap:11px;min-width:0;width:100%}
.ini{width:36px;height:36px;border-radius:12px;background:var(--gts);color:var(--gt);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.ini.L{background:var(--pinks);color:var(--pink)}.ini.O{background:var(--infos);color:var(--info)}.ini.H{background:#ECEFF3;color:var(--muted)}
.nm b{display:block;font-weight:700}
.nm small{color:var(--muted);font-size:11.5px;font-weight:600}
.ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.tg button{padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tg button.on.in{background:var(--gt);color:#fff}.tg button.on.off{background:var(--navy);color:#fff}.tg button.on.lv{background:var(--bad);color:#fff}
.tin{width:92px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:13px;font-weight:700;text-align:center}
@media (max-width:560px){.ar{grid-template-columns:1fr}.ac{justify-content:flex-start}}

/* EXCEL-STYLE DAY TARGET SHEET (branch colours) */
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.slots::-webkit-scrollbar{display:none}
.sl{flex:none;min-width:96px;border-radius:15px;padding:9px 12px;text-align:left;background:var(--soft)}
.sl b{display:block;font-family:var(--fd);font-weight:700;font-size:15px}
.sl small{font-size:11px;color:var(--muted);font-weight:700}
.sl.sent small{color:var(--gt)}
.sl.due{box-shadow:inset 0 0 0 2px var(--gt)}
.sl.due small{color:var(--gt)}
.sl.on{background:var(--navy);color:#fff;box-shadow:none}
.sl.on small{color:var(--gth)}
.xs{--b:#CF0165;--bt:#fff;--sub:#B9B5B4;--subt:#0A1A2B;--rw:#fff;--ft:var(--b);--ftt:#fff;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(10,26,43,.12);background:#fff}
.xs.Guduvanchery{--b:#B5C5E9;--bt:#13294A;--sub:#B5C5E9;--subt:#13294A;--rw:#fff;--ft:#B5C5E9;--ftt:#13294A}
.xs.Urapakkam{--b:#C9C9C9;--bt:#1D1D1D;--sub:#C9C9C9;--subt:#1D1D1D;--rw:#F8CBAD;--ft:#C9C9C9;--ftt:#1D1D1D}
.xs.Chengalpattu{--b:#A9D08E;--bt:#1F3A12;--sub:#D5E8C8;--subt:#1F3A12;--rw:#fff;--ft:#A9D08E;--ftt:#1F3A12}
.xsh{background:var(--b);color:var(--bt);text-align:center;padding:12px 10px 10px;font-family:var(--fd)}
.xsh b{display:block;font-size:19px;font-weight:800;letter-spacing:.04em}
.xsh span{font-size:13px;font-weight:600;opacity:.9}
.xsw{overflow-x:auto}
table.xt{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums;font-size:14px}
.xt th{background:var(--b);color:var(--bt);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:9px 6px;border:1px solid rgba(0,0,0,.14);text-align:center;line-height:1.2}
.xt td{border:1px solid rgba(10,26,43,.12);height:44px;text-align:center;font-weight:700;background:var(--rw);padding:0}
.xt td.nmc{text-align:left;padding:0 10px;font-weight:800;white-space:nowrap;position:sticky;left:0;z-index:1;background:var(--rw)}
.xt td.nmc .fr{display:block;font-size:10px;font-weight:700;color:var(--info)}
.xt td.lk{color:#6B7787}
.xt td.cl{color:var(--ink)}
.xt td input{width:100%;height:43px;border:0;background:transparent;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:0 4px}
.xt td input:focus{outline:2px solid var(--gt);outline-offset:-2px;background:#fff}
.xt td input:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.xt td .pb{width:100%;height:43px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.xt td .pb:hover{background:rgba(30,158,99,.08)}
.xt td .pb i{font-style:normal;font-size:16px;color:var(--gt);font-weight:800}
.xt tr.sub td{background:var(--sub);color:var(--subt);font-weight:800}
.xt tr.sub td.nmc{background:var(--sub)}
.xt tr.gt td{background:var(--navy);color:#fff;font-weight:800;border-color:var(--navy)}
.xt tr.gt td.nmc{background:var(--navy)}
.xt tr.ft td{background:var(--ft);color:var(--ftt);font-weight:800;height:38px}
.xt tr.ft td.nmc{background:var(--ft)}
.xt tr.ft td input{height:37px;color:var(--ftt);-webkit-text-fill-color:var(--ftt)}
.xt .stars{color:#E8A400;letter-spacing:1px}
.xt .low{color:var(--bad)!important;-webkit-text-fill-color:var(--bad)!important}
.xbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.saved{font-size:12px;font-weight:700;color:var(--gt);display:inline-flex;gap:6px;align-items:center}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gt)}

/* closing lists */
.lt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lt th{font-size:11px;color:var(--muted);text-align:left;padding:6px 6px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.lt td{border-top:1px solid var(--line);padding:3px 4px}
.lt td input{width:100%;border:0;background:transparent;padding:9px 6px;font-weight:700;font-size:14px;border-radius:8px}
.lt td input:focus{outline:2px solid var(--gt);outline-offset:-2px;background:#fff}
.lt td.r,.lt th.r{text-align:right}.lt td.r input{text-align:right}
.lt tr.tt td{font-weight:800;padding:11px 6px;background:var(--soft)}
.lt .x{color:var(--muted);font-size:16px;padding:6px 8px;border-radius:8px}
.lt .x:hover{background:var(--bads);color:var(--bad)}
.chk{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--soft);font-weight:700;font-size:13px;align-items:center}
.chk .d{font-family:var(--fd);font-size:16px}
.chk input{width:120px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:right;font-weight:700}
.up{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.up label{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);font-weight:800;font-size:12.5px;cursor:pointer}
.up input{display:none}
.up label svg{width:18px;height:18px}
.upt{width:100%;font-size:12px;font-weight:800;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--soft);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}

const monthAtt = d => { const m = S.month.find(x => x.date === d); return m ? m.att || {} : {}; };

  return `<input type="time" class="tin tt ${y.out ? '' : 'need'}" id="yo_${esc(p.n)}" data-yout="${esc(p.n)}" value="${esc(y.out || '')}" aria-label="${esc(p.n)} yesterday out time">`; };

const monthDays = () => [...Array(dim(S.today))].map((_, i) => S.today.slice(0, 8) + String(i + 1).padStart(2, '0'));
function attSummary(n) { let w = 0, o = 0, l = 0; monthDays().filter(d => d <= S.today).forEach(d => { const a = attOf(n, d); if (a.st === 'in') w++; else if (a.st === 'off') o++; else if (a.st === 'lv') l++; });
  const allowed = Math.min(num(S.settings.woMax) || 4, Math.floor(w / (num(S.settings.woPer) || 6))), extra = Math.max(0, o - allowed); return { w, o, l: l + extra, allowed, extra }; }

    <td>${inp(p.n, 'svc', v.svc)}</td><td>${inp(p.n, 'bills', v.bills)}</td><td class="cl" data-abv="${esc(p.n)}">${abv(v.svc, v.bills) === '–' ? '' : fmt(abv(v.svc, v.bills))}</td><td>${inp(p.n, 'kids', v.kids)}</td>

  </tbody></table></div></div>`;

    case 'addnew': openSheet(SHEETS.newstaff()); break;
    case 'rmstaff': openSheet(SHEETS.rmstaff(v)); break;
    case 'openslot': S.view = R().snaps[v] ? v : 'live'; S.page = 'report'; render(); break;
    case 'view': S.view = v; render(); break;
    case 'prod': openSheet(SHEETS.prod(v)); break;
    case 'delprod': { const n = el.dataset.n, r = R().rows[n], x = r.prod[+v]; el.disabled = true;
      try { S.stock = mergeStock(await call('appStockOp', S.tok, ME(), 'unsale', { n: x.n, q: x.q })); r.prod.splice(+v, 1); touch(S.today, 'rep'); S.moves = null; openSheet(SHEETS.prod(n)); render(); } catch (er) { toast(er instanceof NetErr ? 'No internet.' : er.message); el.disabled = false; } break; }
    case 'sendslot': el.disabled = true; await sendSlot(); el.disabled = false; break;
    case 'img': { const r = R(), snap = S.view !== 'live' ? r.snaps[S.view] : null; reportImage(snap ? snap.list : present(), snap ? snap.data : r.rows, snap ? snap.mcAmt : r.mcAmt, snap ? snap.at : now(), (snap ? slotName(S.view) : 'Live') + ' report'); break; }
    case 'copyimg': { const cv = window.__img, er = document.getElementById('serr'); if (!cv) break; cv.toBlob(b => { try { navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]).then(() => toast('Copied · paste it in WhatsApp'), () => { er.textContent = 'Press Download, or right-click the image and copy it.'; }); } catch (x) { er.textContent = 'Press Download, or right-click the image and copy it.'; } }); break; }
    case 'dlimg': { const cv = window.__img; if (!cv) break; const l = document.createElement('a'); l.download = (window.__imgName || 'report') + ' ' + S.today + '.png'; l.href = cv.toDataURL('image/png'); l.click(); break; }
    case 'splus': { const n = el.dataset.n; el.disabled = true; if (await stockOp('plus', n)) toast('1 × ' + n + ' added · controller told'); break; }
    case 'sminus': { const n = el.dataset.n, it = S.stock.find(x => x.branch === ME() && x.n === n); if (!it || it.c <= 0) { toast('None in stock'); break; } openSheet(SHEETS.reduce(n)); break; }
    case 'sreason': { const n = el.dataset.n, r = v || val('x_n').trim(); if (!r) { document.getElementById('serr').textContent = 'Pick a reason or write one.'; break; } closeSheet(); if (await stockOp('minus', n, { reason: r })) toast('1 removed · controller told'); break; }
    case 'attday': { const d = v, list = people().map(p => ({ p, a: attOf(p.n, d) }));
      openSheet(`<h3>${dLabel(d)}</h3><div class="sub">${list.filter(x => x.a.st === 'in').length} in · ${list.filter(x => x.a.st === 'off').length} week off · ${list.filter(x => x.a.st === 'lv').length} leave</div>
      ${list.map(({ p, a: x }) => `<div class="row"><div class="nm"><span class="ini ${p.g}">${esc(ini(p.n))}</span><div><b>${esc(p.n)}</b><small>${GN[p.g]}</small></div></div><div style="text-align:right">${x.st ? `<span class="pill ${x.st === 'in' ? 'p-gt' : x.st === 'off' ? 'p-info' : 'p-bad'}">${AST[x.st][0]}</span>` : '<span class="pill p-mu">Not marked</span>'}${x.in ? `<div class="cs" style="margin-top:4px">${t12(x.in)} – ${x.out ? t12(x.out) : '…'}</div>` : ''}</div></div>`).join('')}
      <div class="sha"><button class="btn gh" data-a="close">Close</button></div>`); break; }
    case 'attperson': { const n = v, s2 = attSummary(n); let cal = DOW.map(x => `<div class="dh">${x[0]}</div>`).join('');
      for (let i = 0; i < dowOf(S.today.slice(0, 8) + '01'); i++) cal += '<div></div>';
      monthDays().forEach(d => { const x = attOf(n, d); cal += `<div class="dc2 ${d > S.today ? 'a-fut' : x.st ? AST[x.st][1] : 'a-none'}"><b>${dnum(d)}</b><span>${x.st === 'in' ? t12(x.in).replace(' am', '').replace(' pm', '') : x.st === 'off' ? 'W/O' : x.st === 'lv' ? 'Leave' : ''}</span></div>`; });
      openSheet(`<h3>${esc(n)}</h3><div class="sub">${monthName(S.today)} · ${esc(ME())}</div><div class="kp" style="margin-bottom:14px;grid-template-columns:repeat(3,1fr)"><div class="k"><div class="kl">Worked</div><div class="kv">${s2.w}</div></div><div class="k"><div class="kl">Week offs</div><div class="kv">${s2.o}<span class="cs"> / ${s2.allowed}</span></div></div><div class="k"><div class="kl">Leave</div><div class="kv" style="color:${s2.l ? 'var(--bad)' : 'inherit'}">${s2.l}</div></div></div>
      <div class="pcal">${cal}</div><div class="sha"><button class="btn gh" data-a="close">Close</button></div>`); break; }
    case 'ycl': S.page = 'closing'; S.cdate = S.yday; lastPage = ''; render(); break;
    case 'clearall': { const c = C(); LKEYS.forEach(kk => { c[kk] = c[kk].filter(r => !r.y && filled(r)); }); if (c.denY) { c.den = {}; c.denY = false; } c.init = {}; touch(CD(), 'clo'); render(); toast("Yesterday's entries cleared"); break; }
    case 'rmphoto': { const c = C(), id = c.photos[+v]; c.photos.splice(+v, 1); markChanged(); touch(CD(), 'clo'); render(); call('appPhoto', S.tok, ME(), CD(), 'remove', id).catch(() => {}); toast('Photo removed'); break; }
    case 'viewphoto': openSheet(`<div class="imgbox"><img src="${S.photos[v]}" alt="Photo"></div><div class="sha"><button class="btn gh" data-a="close">Close</button></div>`); break;
    case 'attimg': snapImage(v === 'month' ? monthImgHTML() : attImgHTML(), v === 'month' ? 'Month attendance' : 'Attendance today'); break;
    case 'cdate': S.cdate = v; render(); break;
    case 'delrow': { const L = C()[el.dataset.l]; L.splice(+v, 1); if (!L.length) L.push(blankL(el.dataset.l)); markChanged(); touch(CD(), 'clo'); render(); break; }
    case 'clearrows': { const c = C(), before = c[v].length; c[v] = c[v].filter(filled); if (!c[v].length) c[v].push(blankL(v)); touch(CD(), 'clo'); render(); toast((before - c[v].length) + ' empty rows removed'); break; }
    case 'addrows': { const L = C()[v], st = L.length; for (let i = 0; i < 10; i++) L.push(blankL(v)); const tb = document.querySelector(`[data-lb="${v}"]`); if (tb) tb.insertAdjacentHTML('beforeend', L.slice(st).map((r, i) => lrow(v, st + i, r, +(tb.dataset.off || 0))).join('')); touch(CD(), 'clo'); toast('10 rows added'); break; }
    case 'sheet': openSheet(SHEETS[v]()); break;
    case 'save': { const er = document.getElementById('serr'); busy(true); try { const r = await SAVE[v](); if (r === 'stay') openSheet(SHEETS[v](val('pn') || document.querySelector('.sh h3').textContent.split(' · ')[0])); else closeSheet(); render(); } catch (x) { if (er) er.textContent = typeof x === 'string' ? x : x instanceof NetErr ? 'No internet. Try again when online.' : (x.message || 'Something went wrong.'); busy(false); } break; }
    case 'submit': await submitClosing(); break;
  }
});
document.addEventListener('change', e => { const t = e.target, d = t.dataset || {}; if (d.l && t.tagName === 'SELECT') { C()[d.l][+d.i][d.k] = t.value; markChanged(); touch(CD(), 'clo'); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();

})();
</script>
