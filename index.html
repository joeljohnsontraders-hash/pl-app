<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="gti-css">
#gti{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#0A1A2B;-webkit-user-select:none;user-select:none}
#gti::before{content:"";position:absolute;inset:-20%;background:radial-gradient(55% 45% at 80% 16%,rgba(46,160,96,.34) 0%,rgba(46,160,96,.25) 30%,rgba(46,160,96,.11) 60%,rgba(46,160,96,.03) 85%,transparent 100%),radial-gradient(52% 42% at 16% 88%,rgba(170,32,121,.3) 0%,rgba(170,32,121,.22) 30%,rgba(170,32,121,.1) 60%,rgba(170,32,121,.03) 85%,transparent 100%);opacity:0;animation:gtiFade .7s ease-out forwards}
.gti-st{position:absolute;inset:0;pointer-events:none}
.gti-st i{position:absolute;top:-30%;width:1px;height:160%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.14) 45%,rgba(255,255,255,.14) 55%,transparent);opacity:0;animation:gtiStreak 1.6s cubic-bezier(.3,0,.2,1) forwards}
.gti-in{position:relative;display:flex;flex-direction:column;align-items:center;width:min(84vw,380px)}
.gti-stage{position:relative;width:100%}
.gti-logo{display:block;width:100%;height:auto;overflow:visible}
.gti-f{fill:var(--c)}
.gti-tag{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:gtiTag .5s .95s cubic-bezier(.2,.8,.2,1) forwards}
.gti-sh{transform:translateX(0);animation:gtiSh .6s 1.05s cubic-bezier(.45,0,.2,1) forwards}
.gti-div{width:44%;height:1px;margin-top:22px;background:linear-gradient(90deg,transparent,#62BB47 30%,#AA2079 70%,transparent);transform:scaleX(0);animation:gtiBarIn .5s .95s cubic-bezier(.2,.8,.2,1) forwards}
.gti-ld{position:relative;width:26px;height:26px;margin-top:18px;color:rgba(255,255,255,.75);opacity:0}
.gti-ld svg{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#gti.wait .gti-ld,#gti.quick.slow .gti-ld{opacity:1;transition:opacity .25s}
#gti.wait .gti-ld svg,#gti.quick.slow .gti-ld svg{animation:gtiCyc 2.4s infinite;animation-delay:calc(var(--k)*.6s)}
#gti.out{animation:gtiOut .38s .14s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
#gti.out .gti-in{animation:gtiLift .22s cubic-bezier(.3,0,.6,1) forwards}
#gti.quick::before,#gti.quick .gti-st,#gti.quick .gti-in{display:none}
#gti.quick.slow .gti-in{display:flex;animation:gtiFade .3s ease forwards}
#gti.quick .gti-fx{display:none}#gti.quick .gti-logo,#gti.quick .gti-logo *{animation:none!important}
#gti.quick .gti-tag{opacity:.92}#gti.quick .gti-div{transform:none;animation:none}#gti.quick .gti-reveal{transform:none}#gti.quick .gti-wv{transform:translate(0,-60px)}
#gti.quick.out{animation-duration:.22s;animation-delay:0s}
@media (min-width:900px){.gti-in{width:520px}.gti-div{margin-top:28px}.gti-ld{width:30px;height:30px;margin-top:22px}}
@keyframes gtiFade{from{opacity:0}to{opacity:1}}
@keyframes gtiStreak{0%{opacity:0;transform:rotate(22deg) translateY(-30%)}30%{opacity:1}100%{opacity:.5;transform:rotate(22deg) translateY(10%)}}
@keyframes gtiTag{from{opacity:0;transform:scaleX(1.12)}to{opacity:.92;transform:none}}
@keyframes gtiSh{to{transform:translateX(900px)}}
@keyframes gtiBarIn{to{transform:none}}
@keyframes gtiCyc{0%{opacity:0;transform:scale(.6) rotate(-20deg)}8%,20%{opacity:1;transform:none}28%,100%{opacity:0;transform:scale(.6) rotate(20deg)}}
@keyframes gtiOut{to{opacity:0;visibility:hidden}}
@keyframes gtiLift{to{opacity:0;transform:translateY(-10px) scale(1.03)}}
@keyframes gtiOutL{to{opacity:0}}
.gti-cut{position:absolute;left:-8%;right:-8%;top:45%;height:2px;margin-top:-1px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 18%,#fff 82%,transparent);box-shadow:0 0 12px rgba(255,255,255,.7);transform-origin:0 50%;transform:scaleX(0);animation:gtiCut .5s .05s cubic-bezier(.55,0,.35,1) forwards,gtiCutOut .35s .55s ease forwards}
.gti-sc{position:absolute;left:0;right:0;top:45%;height:0;animation:gtiRun .5s .05s cubic-bezier(.55,0,.35,1) forwards;transform:translateX(-12%)}
.gti-sc svg{position:absolute;left:-26px;top:-26px;width:52px;height:52px;color:#fff;overflow:visible;opacity:0;animation:gtiScOp .58s .05s linear forwards}
.gti-sc .b1,.gti-sc .b2{transform-origin:13.35px 12px}
.gti-sc .b1{animation:gtiSnipA .5s .05s linear forwards}.gti-sc .b2{animation:gtiSnipB .5s .05s linear forwards}
.gti-top,.gti-bot{transform:translateY(0);opacity:0}
.gti-top{animation:gtiTop .55s .5s cubic-bezier(.2,1.3,.4,1) forwards}.gti-bot{animation:gtiBot .55s .5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes gtiCut{to{transform:scaleX(1)}}
@keyframes gtiCutOut{0%{opacity:1;transform:scaleX(1) scaleY(1)}100%{opacity:0;transform:scaleX(1) scaleY(6)}}
@keyframes gtiRun{to{transform:translateX(104%)}}
@keyframes gtiScOp{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes gtiSnipA{0%,50%,100%{transform:rotate(16deg)}25%,75%{transform:rotate(-1deg)}}
@keyframes gtiSnipB{0%,50%,100%{transform:rotate(-16deg)}25%,75%{transform:rotate(1deg)}}
@keyframes gtiTop{0%{opacity:0;transform:translateY(26px)}25%{opacity:1}100%{opacity:1;transform:none}}
@keyframes gtiBot{0%{opacity:0;transform:translateY(-26px)}25%{opacity:1}100%{opacity:1;transform:none}}
#gti.quick .gti-top,#gti.quick .gti-bot{opacity:1}
@media (prefers-reduced-motion:reduce){#gti .gti-fx,#gti .gti-st,.gti-sh{display:none}#gti .gti-logo *{animation:none!important}.gti-wv{transform:translate(0,-60px)!important}.gti-top,.gti-bot{opacity:1!important}.gti-tag{opacity:.92}.gti-div{animation:none!important;transform:none}}
</style>
<title>Green Trends</title>
<meta name="theme-color" content="#0A1A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green Trends">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/icon-96.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: deep navy shell with a glowing branded header; white sheets below; reports keep each branch's Excel colours */
:root{
  --navy:#0A1A2B;--navy2:#132B44;--navy3:#1C3A58;--ground:#EEF1F6;--card:#FFFFFF;--ink:#0A1A2B;--muted:#5A6779;--line:#E2E7EF;--soft:#F6F8FB;
  --gt:#1E9E63;--gth:#7EE0AE;--gts:#E2F5EC;--pink:#E0217A;--pinks:#FCE4EF;
  --ok:#14804A;--oks:#DFF3E8;--warn:#9A6200;--warns:#FDF0D5;--bad:#B4362B;--bads:#FBE6E3;--info:#2D4E9E;--infos:#E6EDFB;
  --fd:'Outfit',ui-sans-serif,system-ui,sans-serif;--fb:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:2px solid var(--gt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}


/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(900px 500px at 85% -10%,#1B4A3E 0%,transparent 60%),radial-gradient(700px 500px at -10% 110%,#3B1440 0%,transparent 55%),var(--navy)}
.lcard{width:100%;max-width:400px;color:#fff}
.lmark{width:60px;height:60px;border-radius:20px;background:linear-gradient(140deg,var(--gt),#0F7A4B);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:22px;margin-bottom:24px;box-shadow:0 12px 30px rgba(30,158,99,.35)}
.lcard h1{font-family:var(--fd);font-weight:700;font-size:34px;margin:0 0 6px;letter-spacing:-.01em}
.lcard h1 em{font-style:normal;color:var(--pink)}
.lcard p{color:#9FB0C2;margin:0 0 26px}
.lf{display:grid;gap:12px}
.lf input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:15px 16px;color:#fff;font-size:16px}
.lf input::placeholder{color:#8396AB}
.lbtn{background:var(--gt);color:#fff;border-radius:16px;padding:15px;font-weight:800;font-size:15px;width:100%}
.ldemo{margin-top:26px;display:grid;gap:10px}
.ldemo button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#E3EBF3;border-radius:16px;padding:13px 14px;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center}
.lerr{color:#FFB4A8;font-size:13px;min-height:18px}

/* shell */
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:104px}
.hd{color:#fff;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden;
  background:radial-gradient(600px 300px at 100% 0%,rgba(30,158,99,.38),transparent 65%),radial-gradient(500px 280px at 0% 120%,rgba(224,33,122,.22),transparent 60%),var(--navy)}
.hd::before,.hd::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.hd::before{width:420px;height:420px;right:-140px;top:-220px}
.hd::after{width:260px;height:260px;right:-60px;top:-140px;border-color:rgba(126,224,174,.18)}
.hdin{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd .eb{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gth)}
.hd .br{font-family:var(--fd);font-size:28px;font-weight:700;line-height:1.1;margin-top:4px;letter-spacing:-.01em}
.hd .dt{color:#A9B9CA;font-size:13px;margin-top:4px;font-weight:600}
.hd .rt{display:flex;gap:8px;align-items:center}
.av{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.14)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{display:grid;gap:16px;margin-top:-44px;position:relative;z-index:2}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
.navin{max-width:540px;margin:0 auto;background:rgba(10,26,43,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 14px 34px rgba(10,26,43,.35);pointer-events:auto}
.navin button{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:700;color:#8EA0B4;padding:7px 4px;border-radius:16px;min-width:50px;flex:1;position:relative}
.navin button.on{color:#fff;background:rgba(255,255,255,.1)}
.navin button.on svg{color:var(--gth)}
.navin svg,.side svg{width:21px;height:21px}
.navin .bd{position:absolute;top:3px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--pink)}
@media (min-width:980px){
  .side{display:flex;flex-direction:column;width:244px;flex:none;background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;gap:4px;border-right:1px solid rgba(255,255,255,.06)}
  .side .lg{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;font-family:var(--fd);font-weight:700;font-size:18px}
  .side .lg span{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--gt),#0F7A4B);display:grid;place-items:center;font-size:14px}
  .side .lg small{display:block;font-family:var(--fb);font-size:11px;color:#8EA0B4;font-weight:600}
  .side button.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;color:#A9B8C8;font-weight:700;text-align:left}
  .side button.it:hover{background:rgba(255,255,255,.05)}
  .side button.it.on{background:rgba(255,255,255,.09);color:#fff}
  .side button.it.on svg{color:var(--gth)}
  .side .who{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12px;color:#A9B8C8}
  .side .who b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
  .nav{display:none}
  .main{padding-bottom:48px}
  .hd{padding-block:28px 72px}
  .hd .br{font-size:32px}
}

/* header hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px}
.ring{width:104px;height:104px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-family:var(--fd);font-size:24px;font-weight:700;line-height:1}
.ring .rv small{font-size:10.5px;color:#A9B9CA;font-weight:700;margin-top:3px}
.glass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 12px;min-width:0}
.gl small{display:block;font-size:11px;color:#A9B9CA;font-weight:700}
.gl b{display:block;font-family:var(--fd);font-size:19px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
@media (max-width:420px){.hero{grid-template-columns:1fr}.ring{display:none}.gl b{font-size:17px}}

/* cards */
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0;box-shadow:0 1px 0 rgba(10,26,43,.04),0 8px 24px rgba(10,26,43,.05)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ct{font-family:var(--fd);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib.g{background:var(--gts);color:var(--gt)}.ib.p{background:var(--pinks);color:var(--pink)}.ib.b{background:var(--infos);color:var(--info)}.ib.y{background:var(--warns);color:var(--warn)}.ib.n{background:#E6EAF0;color:var(--navy)}
.cs{color:var(--muted);font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--oks);color:var(--ok)}.p-warn{background:var(--warns);color:var(--warn)}.p-bad{background:var(--bads);color:var(--bad)}.p-info{background:var(--infos);color:var(--info)}.p-gt{background:var(--gts);color:var(--gt)}.p-mu{background:var(--soft);color:var(--muted)}
.hd .pill.p-mu{background:rgba(255,255,255,.08);color:#C9D5E1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;background:var(--gt);color:#fff;white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.dk{background:var(--navy)}
.btn.pk{background:var(--pink)}
.btn.gh{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.wide{width:100%;padding:16px;font-size:15px;border-radius:18px}
.btn svg{width:17px;height:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l small{color:var(--muted);font-size:12px;font-weight:600}
.tap{width:100%;text-align:left;border-radius:12px}
.tap:hover{background:var(--soft)}
.g2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:980px){.g2{grid-template-columns:1.3fr 1fr}.g2e{grid-template-columns:1fr 1fr}}
.empty{color:var(--muted);font-size:13px;padding:6px 0;font-weight:600}
.note{border-radius:16px;padding:13px 15px;font-size:13px;font-weight:600}
.n-warn{background:var(--warns);color:#6B4500}.n-bad{background:var(--bads);color:#8C2219}.n-ok{background:var(--oks);color:#0F5C37}.n-info{background:var(--infos);color:#1F3A7A}

/* next-up */
.next{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--gt),#11784A);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 12px 28px rgba(30,158,99,.28)}
.next .tx{flex:1;min-width:0}
.next small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#C9F3DD}
.next b{display:block;font-family:var(--fd);font-size:20px;font-weight:700;margin-top:2px}
.next .btn{background:#fff;color:var(--gt)}
.next.done{background:linear-gradient(120deg,var(--navy2),var(--navy))}
.next.done small{color:var(--gth)}.next.done .btn{color:var(--navy)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tli{border-radius:16px;padding:11px 8px;text-align:center;background:var(--soft);min-width:0;position:relative}
.tli b{display:block;font-family:var(--fd);font-size:15px;font-weight:700}
.tli small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli.sent{background:var(--gts)}.tli.sent small{color:var(--gt)}
.tli.due{background:var(--navy);color:#fff}.tli.due small{color:var(--gth)}
button.tli{width:100%}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border-radius:18px;padding:14px;background:var(--soft);text-align:left;display:grid;gap:8px;min-width:0}
.tile:hover{background:#EEF2F7}
.tile b{font-weight:800;font-size:13.5px}
.tile .v{font-family:var(--fd);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile small{font-size:11.5px;color:var(--muted);font-weight:700}
.tile.miss small{color:var(--bad)}

/* attendance */
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ar:first-of-type{border-top:0}
.gh4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.nm{display:flex;align-items:center;gap:11px;min-width:0;width:100%}
.ini{width:36px;height:36px;border-radius:12px;background:var(--gts);color:var(--gt);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.ini.L{background:var(--pinks);color:var(--pink)}.ini.O{background:var(--infos);color:var(--info)}.ini.H{background:#ECEFF3;color:var(--muted)}
.nm b{display:block;font-weight:700}
.nm small{color:var(--muted);font-size:11.5px;font-weight:600}
.ac{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.tg button{padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tg button.on.in{background:var(--gt);color:#fff}.tg button.on.off{background:var(--navy);color:#fff}.tg button.on.lv{background:var(--bad);color:#fff}
.tin{width:92px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:13px;font-weight:700;text-align:center}
@media (max-width:560px){.ar{grid-template-columns:1fr}.ac{justify-content:flex-start}}

/* EXCEL-STYLE DAY TARGET SHEET (branch colours) */

.sl.on{background:var(--navy);color:#fff;box-shadow:none}

.xs.Urapakkam{--b:#C9C9C9;--bt:#1D1D1D;--sub:#C9C9C9;--subt:#1D1D1D;--rw:#F8CBAD;--ft:#C9C9C9;--ftt:#1D1D1D}

table.xt{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums;font-size:14px}

.xbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}

.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--soft);max-width:100%}

.padd{aspect-ratio:3/4;border-radius:14px;border:2px dashed #C9D2DE;display:grid;place-content:center;justify-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;background:var(--soft)}
.padd:hover{border-color:var(--gt);color:var(--gt)}
.padd svg{width:22px;height:22px}
.padd input{display:none}
.upd{display:inline-flex;align-items:center;gap:10px}
.upd span{display:grid;gap:2px;font-size:12px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.cbox{display:grid;gap:10px;min-width:0}

.xc .xsh span{font-size:12px}

.x2 th{font-size:10.5px;padding:8px 6px}
.x2 td{height:36px}
.x2 td.sn{width:52px;color:#6B7787;font-weight:700;font-size:12.5px}

.acc2 tr.b-sale td{background:#D9EFD3}.acc2 tr.b-exp td{background:#E5484D;color:#fff}.acc2 tr.b-gp td{background:#EBD5F7}.acc2 tr.b-bal td{background:var(--b);color:var(--bt)}.acc2 tr.b-den td{background:#D6E6F6}

.att2 th{font-size:11px;color:var(--muted);text-align:left;padding:6px 8px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.att2 td{border-top:1px solid var(--line);padding:8px;font-weight:700}
.xb{width:26px;height:26px;border-radius:8px;color:#9AA5B4;font-size:13px;font-weight:800;flex:none}

.ac2{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-size:11px;font-weight:800;font-style:normal}

.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg .ac2{width:18px;height:18px;border-radius:6px;font-size:9.5px}
.pcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.dc2{border-radius:12px;padding:6px 2px;text-align:center;min-height:50px;display:grid;align-content:center;gap:2px}

.x-ok{background:var(--gts)}.x-ok span{color:var(--gt)}

.x-sh{background:var(--bads)}.x-sh span{color:var(--bad)}
.x-none{background:var(--soft)}.x-fut{background:transparent;box-shadow:inset 0 0 0 1px #EEF1F5}
.xsum{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:700;color:var(--muted)}
.xsum b{font-family:var(--fd);font-size:16px;color:var(--ink);margin-left:4px}
.xrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.xb2{text-align:left;border-radius:16px;background:var(--soft);padding:12px 14px;display:grid;gap:4px}

.rt2{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}

/* sheet / toast */

async function post(url, fn, args) {
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) }); }
  catch (e) { throw new NetErr('offline'); }
  try { return await r.json(); } catch (e) { throw new NetErr('bad reply'); }
}
async function call(fn, ...args) {
  const fast = !window.__API && FAST.has(fn);
  let j = await post(window.__API || (fast ? SBAPI : EXEC), fn, args);
  if (fast && j.error === 'NOT_READY') j = await post(EXEC, fn, args);
  else if (!fast && FAST.has(fn) && j.error === MOVED) j = await post(SBAPI, fn, args);
  if (j.error) { if (j.error === 'SESSION') { signOut(true); } throw new Error(j.error); }
  return j.result;
}

const KEEP = ['status', 'note', 'sentAt', 'issues', 'waived', 'late'];
async function flush() {
  if (flushing) { again = true; return; } flushing = true;
  try {
    for (const key of [...dirty]) {
      const [date, part] = key.split('|'); const o = (S.days[date] || {})[part]; if (!o) { dirty.delete(key); continue; }
      dirty.delete(key);
      try {
        let r = await call('appSave', S.tok, ME(), date, part, o, S.asBranch ? 'live' : '');
        if (r && r.conflict) {
          const sv = r.data || {};
          if (part === 'clo') KEEP.forEach(f => { if (sv[f] !== undefined) o[f] = sv[f]; });
          if (part === 'rep') o.snaps = Object.assign({}, sv.snaps || {}, o.snaps || {});
          o._v = sv._v || 0;
          r = await call('appSave', S.tok, ME(), date, part, o, S.asBranch ? 'live' : '');
        }
        if (r && r.ok) o._v = r._v;
        setOffline(false);
      } catch (e) {
        if (e instanceof NetErr) { dirty.add(key); setOffline(true); break; }
        toast(e.message);
      }
    }
  } finally { flushing = false; persist(); setSaved(dirty.size ? (S.offline ? 'offline' : 'saving') : 'saved'); if (again) { again = false; flush(); } }
}
async function flushNow() { clearTimeout(flushT); await flush(); while (flushing) await new Promise(r => setTimeout(r, 120)); if (dirty.size && !S.offline) await flush(); return !dirty.size; }
function setOffline(v) { if (S.offline === v) return; S.offline = v; setSaved(v ? 'offline' : dirty.size ? 'saving' : 'saved'); }
function setSaved(st) { const el = document.getElementById('conn'); if (!el) return;

}

function carryOver() { const c = C(); if (!isToday() || c.carried) return; c.carried = true; const y = S.days[S.yday].clo; if (!y || (!LKEYS.some(kk => (y[kk] || []).some(filled)) && !Object.keys(y.den || {}).some(d => num(y.den[d])))) return;

  let n = 1; const line = (t, d, cr, cls, tag) => `<tr class="${cls || ''}"><td class="sn">${n++}</td><td class="pt">${t}${tag ? `<span class="ftag">${tag}</span>` : ''}</td><td></td><td>${d === '' ? '' : fmt(d)}</td><td>${cr === '' ? '' : fmt(cr)}</td><td></td></tr>`;

const denHTML = () => `<div class="xs ${ME()} xc"><div class="xsh"><b>CASH IN DENOMINATIONS</b><span>Closing · ${dShort(CD())}</span></div><div class="xsw"><table class="xt x2">

  opedit(el) { openSheet(`<h3>Edit product</h3><div class="sub">${esc(O.ob)}</div>${fl('pe_n', 'Name', el.dataset.n)}${fl('pe_m', 'Price ₹', el.dataset.m === '0' ? '' : el.dataset.m, 'n')}<input type="hidden" id="pe_o" value="${esc(el.dataset.n)}"><div class="err" id="serr"></div><div class="sha"><button class="btn gh" data-a="close">Cancel</button><button class="btn" data-a="opeditsave">Save</button></div>`); },
  async opeditsave() { busy(true); try { const list = await call('appStockOp', S.tok, O.ob, 'pedit', { n: val('pe_o'), nn: val('pe_n').trim(), mrp: val('pe_m'), q: 1 }); S.stock = S.stock.filter(x => x.branch !== O.ob).concat(list); O.all.stock = S.stock; closeSheet(); toast('Saved'); loadAll(true); render(); } catch (e) { document.getElementById('serr').textContent = e.message; busy(false); } },
  opdel(el) { openSheet(`<h3>Delete ${esc(el.dataset.n)}?</h3><div class="sub">It is taken off the ${esc(O.ob)} product list. Reports already sent keep it.</div><input type="hidden" id="pd_n" value="${esc(el.dataset.n)}"><div class="err" id="serr"></div><div class="sha"><button class="btn gh" data-a="close">Cancel</button><button class="btn" style="background:var(--bad)" data-a="opdelok">Delete</button></div>`); },
  async opdelok() { busy(true); try { const list = await call('appStockOp', S.tok, O.ob, 'premove', { n: val('pd_n'), q: 1 }); S.stock = S.stock.filter(x => x.branch !== O.ob).concat(list); O.all.stock = S.stock; closeSheet(); toast('Deleted'); loadAll(true); render(); } catch (e) { document.getElementById('serr').textContent = e.message; busy(false); } },
  omrp(el) { openSheet(`<h3>${esc(el.dataset.n)}</h3>${fl('mr_v', 'MRP ₹', '', 'n')}<input type="hidden" id="mr_n" value="${esc(el.dataset.n)}"><div class="err" id="serr"></div><div class="sha"><button class="btn gh" data-a="close">Cancel</button><button class="btn" data-a="omrpsave">Save</button></div>`); },
  async omrpsave() { busy(true); try { const list = await call('appStockOp', S.tok, O.ob, 'mrp', { n: val('mr_n'), mrp: val('mr_v'), q: 1 }); S.stock = S.stock.filter(x => x.branch !== O.ob).concat(list); O.all.stock = S.stock; closeSheet(); render(); } catch (e) { document.getElementById('serr').textContent = e.message; busy(false); } }
};
document.addEventListener('click', async e => { if (!isOffice() || S.asBranch) return; const el = e.target.closest('[data-a]'); if (!el) return; const f = OACT[el.dataset.a]; if (f) { e.stopImmediatePropagation(); await f(el); } }, true);
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.fix !== undefined) { O.fix = O.fix || {}; O.fix[t.dataset.fix] = t.value; t.classList.toggle('need', !t.value); } });

/* ---------- the controller inside a branch's manager app ---------- */
async function enterBranch(b) {
  S.asBranch = b; S.follow = true; S.page = 'today'; S.booted = false; render();
  try { const d0 = O.all.today, d1 = O.all.yday, d2 = addDays(d0, -2), r = await Promise.all([d0, d1, d2].map(d => call('appDay', S.tok, b, d))), mo = await call('appMonthApi', S.tok, b, d0.slice(0, 7));
    S.days = {}; S.used = {}; r.forEach(x => { S.days[x.date] = { att: x.att, rep: x.rep, clo: x.clo }; S.used[x.date] = !!(x.att || x.rep || x.clo); }); S.month = mo; S.today = d0; S.yday = d1; S.cdate = d0; S.staff = O.all.staff; S.stock = O.all.stock;
    S.booted = true; prepDays(); render(); pollWatch(); }
  catch (e) { S.asBranch = null; toast(e instanceof NetErr ? 'No internet.' : e.message); render(); }
}
function leaveBranch() { S.asBranch = null; S.follow = false; S.days = {}; S.page = 'home'; lastPage = ''; loadAll(); }

document.addEventListener('change', e => { if (e.target.id === 'mt_all') document.querySelectorAll('.mtb').forEach(x => { x.disabled = e.target.checked; if (e.target.checked) x.checked = false; }); });
/* ---------- beats (which page is open), quiet refresh, reminders ---------- */
let lastBeat = '', beatT = 0;
function beatCheck() { const key = S.page + '|' + (isOffice() ? O.ob : ''); if (key !== lastBeat) { lastBeat = key; clearTimeout(beatT); beatT = setTimeout(beatNow, 400); } }
/* live view removed: apps no longer report which page is open */
function beatNow() { return; if (!S.tok || !S.me || S.asBranch || O.mirror || S.me.role === 'controller' || document.visibilityState !== 'visible') return;
  call('appBeat', S.tok, { page: S.page, sub: isOffice() ? O.ob : '' }).then(r => { if (r && r.cmd && S.me.role === 'manager' && NAV.some(n => n[0] === r.cmd)) { S.page = r.cmd; closeSheet(); render(); } }).catch(() => {}); }
setInterval(beatNow, 45000);
const typing = () => { const a = document.activeElement; return !!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) || !!document.querySelector('.ov'); };
async function refreshDay() { if (!S.tok || !S.me || !S.booted || !S.today || (S.me.role !== 'manager' && !S.asBranch) || document.visibilityState !== 'visible' || dirty.size || flushing || typing()) return;
  try { const ds2 = [S.today]; if (S.page === 'closing' && CD() !== S.today) ds2.push(CD()); let ch = false;
    for (const d of ds2) { const x = await call('appDay', S.tok, ME(), d); if (dirty.size || typing()) return; const cur = S.days[d] || {};
      ['att', 'rep', 'clo'].forEach(p => { const sv = x[p]; if (sv && (sv._v || 0) > ((cur[p] || {})._v || 0)) { cur[p] = sv; ch = true; } }); S.days[d] = cur; day(d); }
    if (ch) { persist(); render(); } } catch (e) {} }
setInterval(() => refreshDay(), 30000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { refreshDay(); beatNow(); } }); setInterval(() => { if (S.asBranch) refreshDay(); }, 6000);
const reminded = {};
setInterval(() => { if (!S.me || S.me.role !== 'manager' || !S.today || !S.days[S.today]) return; const hm = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()), [h, m] = hm.split(':').map(Number), nowM = h * 60 + m;
  slotTimes().forEach((t, i) => { const key = SLOTS[i][0], [th, tm] = t.split(':').map(Number), at = th * 60 + tm, before = num(S.settings.remindMin) || 5; if (R().snaps[key] || (R().skip || {})[key] || reminded[S.today + key] || nowM < at - before || nowM > at + 60) return;
    reminded[S.today + key] = 1; toast(slotName(key) + ' report is due'); try { if (window.Notification && Notification.permission === 'granted') new Notification('Green Trends', { body: slotName(key) + ' report is due' }); } catch (e) {} }); }, 30000);
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.follow) { S.follow = e.target.checked; } });
document.addEventListener('click', e => { const el = e.target.closest('[data-a=attdone]'); if (el && window.Notification && Notification.permission === 'default') { try { Notification.requestPermission(); } catch (x) {} } }, true);

/* inbox: check every minute, and when the app comes back to the front */
setInterval(() => inboxLoad(), 60000); setTimeout(() => inboxLoad(), 2500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') inboxLoad(); });
try { const pv = num(ls('gt_ver')); if (pv && pv < APP_VER) setTimeout(() => toast('App updated · see what is new in Inbox'), 3000); ls('gt_ver', APP_VER); } catch (e) {}

if ('serviceWorker' in navigator && !EMBED) navigator.serviceWorker.register('/sw.js').catch(() => {});
boot();

})();
</script>
